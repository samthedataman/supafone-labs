site_name: Supafone Labs
site_description: Production infrastructure for building, supervising, testing, and operating voice agents across providers.
site_url: https://labs.supafone.ai/
repo_url: https://github.com/samthedataman/supafone-labs
repo_name: supafone/labs

theme:
  name: material
  logo: assets/supafone-logo.png
  favicon: assets/supafone-logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Why Supafone: index.md
  - Quickstart: quickstart.md
  - CLI: cli.md
  - Supervisor Models: supervisor-models.md
  - Framework Coverage: providers.md
  - Hosted Agents API: hosted-agents-api.md
  - Unified S2S Interface: unified-s2s.md
  - Ultravox + Custom TTS and Native S2S: voice-output-modes.md
  - Native Realtime Agent Factory: realtime-agent-factory.md
  - Shared Runtime, Manager and Teams: shared-agent-runtime.md
  - Outbound IVR Call Mode: outbound-ivr-call-mode.md
  - Language and Voice Routing: live-language-voice-routing.md
  - Research QA Roadmap: research/qa-ssr-roadmap.md

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
