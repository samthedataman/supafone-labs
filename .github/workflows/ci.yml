name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all]
          pip install pytest pytest-asyncio "ruff>=0.15,<0.16"

      - name: Lint
        run: ruff check src

      - name: Import smoke test (must import with zero LLM extras)
        run: python -c "import supafone_labs, supafone_labs.runtime; print('ok')"

      - name: Test
        run: pytest tests -q --ignore-glob='tests/test_cloud_*.py'

  typescript-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk-ts/package-lock.json
      - run: npm ci --prefix sdk-ts
      - run: npm test --prefix sdk-ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[docs]'
      - run: mkdocs build --strict
